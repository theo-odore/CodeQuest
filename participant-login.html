<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="CodeQuest — Join the live quiz as a participant." />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230B0E14'/%3E%3Crect x='6' y='6' width='52' height='52' rx='10' fill='%23141924' stroke='%235EE7FF' stroke-width='2'/%3E%3Ctext x='32' y='42' font-family='monospace' font-weight='800' font-size='28' fill='%235EE7FF' text-anchor='middle'%3EQ%3C/text%3E%3C/svg%3E" />
<title>CodeQuest — Join the Quiz</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="center-screen">
    <div class="auth-card">
      <div class="eyebrow">codequest // participant</div>
      <h1>Join CodeQuest</h1>
      <p class="desc">Enter your details to connect. The quiz timer is shared by everyone — if it's already running or finished, you'll join right where the group is.</p>

      <form id="joinForm">
        <div class="field">
          <label for="name">Name</label>
          <input id="name" type="text" placeholder="Your full name" required />
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" type="email" placeholder="you@example.com" required />
        </div>
        <div class="grid-2">
          <div class="field">
            <label for="lab">Lab no.</label>
            <input id="lab" type="text" placeholder="e.g. L3" required />
          </div>
          <div class="field">
            <label for="terminal">Terminal no.</label>
            <input id="terminal" type="text" placeholder="e.g. T12" required />
          </div>
        </div>
        <button class="btn btn-primary btn-full" type="submit" id="joinBtn">Enter quiz</button>
        <div class="error-msg" id="errorMsg"></div>
      </form>
    </div>
  </div>

  <script type="module">
    import { auth, db, ref, set, get, signInAnonymously } from "./firebase-config.js";
    import { getSessionId } from "./js/utils.js";
    import { getQuizPhase } from "./js/utils.js";

    const form = document.getElementById("joinForm");
    const errorMsg = document.getElementById("errorMsg");
    const joinBtn = document.getElementById("joinBtn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorMsg.classList.remove("show");
      joinBtn.disabled = true;
      joinBtn.textContent = "Connecting…";
      try {
        const name = document.getElementById("name").value.trim();
        const email = document.getElementById("email").value.trim();
        const lab = document.getElementById("lab").value.trim();
        const terminal = document.getElementById("terminal").value.trim();

        const cred = await signInAnonymously(auth);
        const uid = cred.user.uid;

        await set(ref(db, `participants/${uid}`), {
          name, email, lab, terminal,
          sessionId: getSessionId(),
          startedAt: Date.now(),
          answers: {},
          totalScore: 0,
          submitted: false,
          completedAt: null
        });

        sessionStorage.setItem("cq_participant_uid", uid);

        // Joining after the quiz's global timer has already ended? Skip the
        // quiz screen entirely and land straight on the coding challenge —
        // this is what makes it feel like one continuous competition instead
        // of two separate events.
        const [quizStateSnap, codeChallengeSnap] = await Promise.all([
          get(ref(db, "quizState")),
          get(ref(db, "codeChallenge"))
        ]);
        const phase = getQuizPhase(quizStateSnap.val());
        const challengeAlreadyLive = codeChallengeSnap.val()?.released === true;

        window.location.href = (phase === "ended" || challengeAlreadyLive) ? "code-challenge.html" : "participant-dashboard.html";
      } catch (err) {
        errorMsg.textContent = "Couldn't connect. Check your network and Firebase config, then try again.";
        errorMsg.classList.add("show");
        joinBtn.disabled = false;
        joinBtn.textContent = "Enter quiz";
      }
    });
  </script>
</body>
</html>
