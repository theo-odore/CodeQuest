<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="CodeQuest — Admin login for quiz control room." />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230B0E14'/%3E%3Crect x='6' y='6' width='52' height='52' rx='10' fill='%23141924' stroke='%235EE7FF' stroke-width='2'/%3E%3Ctext x='32' y='42' font-family='monospace' font-weight='800' font-size='28' fill='%235EE7FF' text-anchor='middle'%3EQ%3C/text%3E%3C/svg%3E" />
<title>CodeQuest — Admin Access</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="center-screen">
    <div class="auth-card">
      <div class="eyebrow">codequest // control room</div>
      <h1>Admin access</h1>
      <p class="desc">Sign in to release questions, run the timer, and publish the leaderboard.</p>

      <form id="loginForm">
        <div class="field">
          <label for="email">Email</label>
          <input id="email" type="email" placeholder="admin@codequest.local" autocomplete="username" required />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" type="password" placeholder="••••••••" autocomplete="current-password" required />
        </div>
        <button class="btn btn-primary btn-full" type="submit" id="loginBtn">Sign in</button>
        <div class="error-msg" id="errorMsg"></div>
      </form>

      <div class="hint-row">
        <span>First run? Sign in with the seeded default credentials once — the account is created automatically.</span>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <script type="module">
    import { auth, onAuthStateChanged } from "./firebase-config.js";
    import { loginOrBootstrapAdmin, isAdminUid } from "./js/auth.js";

    const form = document.getElementById("loginForm");
    const errorMsg = document.getElementById("errorMsg");
    const loginBtn = document.getElementById("loginBtn");

    // If already signed in as admin, skip straight to the dashboard.
    onAuthStateChanged(auth, async (user) => {
      if (user && (await isAdminUid(user.uid))) {
        window.location.href = "admin-dashboard.html";
      }
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorMsg.classList.remove("show");
      loginBtn.disabled = true;
      loginBtn.textContent = "Signing in…";
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      try {
        await loginOrBootstrapAdmin(email, password);
        window.location.href = "admin-dashboard.html";
      } catch (err) {
        errorMsg.textContent = friendlyError(err);
        errorMsg.classList.add("show");
        loginBtn.disabled = false;
        loginBtn.textContent = "Sign in";
      }
    });

    function friendlyError(err) {
      const code = err.code || "";
      if (code.includes("wrong-password") || code.includes("invalid-credential")) return "Incorrect email or password.";
      if (code.includes("too-many-requests")) return "Too many attempts. Try again shortly.";
      if (code.includes("invalid-email")) return "Enter a valid email address.";
      return "Couldn't sign in. Check your Firebase config and try again.";
    }
  </script>
</body>
</html>
